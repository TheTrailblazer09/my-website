    <path d="M252 460 C248 436 250 418 258 406 L306 404 C314 418 312 440 304 460 Z" fill="#cf9572"/>
    <rect x="252" y="376" width="56" height="13" rx="6.5" fill="#cf9572"/>
    <rect x="252" y="389" width="58" height="13" rx="6.5" fill="#cf9572"/>
    <rect x="254" y="402" width="54" height="13" rx="6.5" fill="#cf9572"/>
    <path d="M256 412 C246 404 246 384 254 374" fill="#cf9572"/>
    <path d="M250 450 C262 444 280 446 300 452" fill="none" stroke-width="2.4" opacity=".6"/>
